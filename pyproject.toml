[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbag-noise-reproduction-v2"
version = "0.1.0"
description = "Source-audited reproduction of Gaussian weight-noise sandbagging experiments"
requires-python = ">=3.10,<3.13"

[project.scripts]
sandbag-repro = "repro.__main__:main"

[tool.setuptools]
packages = ["repro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

